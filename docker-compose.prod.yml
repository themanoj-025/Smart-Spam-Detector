# ═══════════════════════════════════════════════════════════════════════
# Smart-Spam-Detector — Production override
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Hardening: restart always, resource limits, no dev mounts.
# ═══════════════════════════════════════════════════════════════════════

services:
  api:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  streamlit:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
