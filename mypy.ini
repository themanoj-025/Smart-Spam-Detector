# Mypy configuration for Smart-Spam-Detector.
#
# The codebase mixes legacy typing patterns (untyped dict access, dynamic
# email-parsing unions, mixed-type lists in the history manager). Those error
# codes are scoped out here so the hook runs on real targets and still catches
# genuine issues (return-value, no-any-return, operator, ...) on new code.
#
# Revisit this list as annotations improve.
[mypy]
ignore_missing_imports = True
# Floor is 3.11 (pyproject requires-python = ">=3.11"); declaring it here
# lets mypy see 3.11+ stdlib members like datetime.UTC. The old 3.10 pin
# made mypy reject the UP017 autofix (timezone.utc -> UTC) applied in 7e645cf.
python_version = 3.11
# Don't descend into third-party packages (numpy/pandas/sklearn stubs) —
# avoid stub-parsing issues across Python versions.
follow_imports = skip
disable_error_code = assignment, annotation-unchecked, arg-type, union-attr, index, list-item, call-arg, dict-item, var-annotated
